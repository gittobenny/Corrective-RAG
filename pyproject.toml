[project]
name = "document-retreiver"
version = "0.1.0"
description = "Corrective RAG"
readme = "README.md"
authors = [
    { name = "gitto", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.2",
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.116.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.5.0",
    "langchain-text-splitters>=1.1.2",
    "pandas>=3.0.5",
    "pypdf>=6.16.1",
    "pymupdf>=1.26.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "sentence-transformers>=5.7.0",
    "tiktoken>=0.13.0",
    "uvicorn>=0.35.0",
    "weaviate-client>=4.23.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
